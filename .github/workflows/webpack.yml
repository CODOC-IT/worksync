# WorkSync — Vite Build CI
# This project uses Vite as its build tool. Webpack is NOT used.
# This workflow replaces the legacy webpack.yml template.

name: Vite Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  vite-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type-check
        run: npm run lint

      - name: Vite production build
        run: npm run build

