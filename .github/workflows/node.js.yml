# WorkSync — Vite / Node.js CI
# Installs deps, type-checks with tsc, then builds the frontend with Vite.
# No webpack. No npm test (no test runner configured).

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check (tsc --noEmit)
        run: npm run lint

      - name: Vite production build
        run: npm run build

